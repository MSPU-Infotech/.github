name: Generate Breakout SVG

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */24 * * *"

jobs:
  generate-svg:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Breakout SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: UdayrajRastogi-Dev

      - name: Check generated files
        run: |
          echo "Checking output folder..."
          pwd
          echo "Files in current directory:"
          ls -la

          echo "Checking output folder:"
          ls -la output || true

      - name: Move generated SVGs to temp
        run: |
          mkdir -p /tmp/breakout-images

          cp output/light.svg \
            /tmp/breakout-images/breakout-light.svg

          cp output/dark.svg \
            /tmp/breakout-images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push Breakout SVGs
        run: |
          git checkout --orphan github-breakout

          git rm -rf . || true

          mkdir -p images

          cp /tmp/breakout-images/breakout-light.svg images/
          cp /tmp/breakout-images/breakout-dark.svg images/

          git add images/

          git commit \
            -m "chore: update GitHub Breakout SVGs" \
            || echo "No changes to commit"

          git push --force origin github-breakout
